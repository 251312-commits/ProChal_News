name: Badge foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  badge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests
      - run: python scripts/sync_badge_catalog.py --check
      - run: python -m unittest discover -s tests -p "test_badge*.py" -v
      - run: node --test tests/test_badges.cjs
