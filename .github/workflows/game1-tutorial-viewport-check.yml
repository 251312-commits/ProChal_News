name: Temporary Game 1 tutorial screen check
on:
  push:
    branches:
      - feat/game1-tutorial-card
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q streamlit==1.55.0 pytest playwright
          if ! fc-list :lang=ko family | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Unit tests
        run: python -m pytest -q
      - name: Check the rendered tutorial at five viewport sizes
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
          PYTHONUNBUFFERED: '1'
        run: |
          export PYTHONPATH="$PWD"
          mkdir -p "$RUNNER_TEMP/guide-evidence"
          cat > "$RUNNER_TEMP/guide_app.py" <<'PY'
          import streamlit as st
          from games.game1_tutorial import show_game_1_tutorial
          from modules.ui_components import change_page, inject_casino_theme
          from sounds.bgm import init_seamless_bgm

          st.session_state.setdefault("page", "game_1_tutorial")
          page = st.session_state.page
          inject_casino_theme()
          init_seamless_bgm("", "", show_controls=page == "main")
          if page == "game_1_tutorial":
              show_game_1_tutorial()
          else:
              st.header("Bet destination" if page == "game_1" else "Main destination")
              if st.button("Open tutorial"):
                  change_page("game_1_tutorial")
          PY
          python -m streamlit run "$RUNNER_TEMP/guide_app.py" --server.address 127.0.0.1 --server.port 8501 --server.headless true > "$RUNNER_TEMP/guide-evidence/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8501/_stcore/health
          python - <<'PY'
          import json
          import os
          import shutil
          import traceback
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          out = Path(os.environ["RUNNER_TEMP"]) / "guide-evidence"
          sizes = [(320, 568), (390, 844), (568, 320), (844, 390), (1280, 720)]
          failures = []
          chrome = shutil.which("google-chrome") or shutil.which("google-chrome-stable")
          assert chrome, "Preinstalled Google Chrome was not found"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=chrome, headless=True)
              for width, height in sizes:
                  label = f"{width}x{height}"
                  context = browser.new_context(
                      viewport={"width": width, "height": height}, locale="ko-KR",
                      is_mobile=width < 1000, has_touch=width < 1000,
                      device_scale_factor=1,
                  )
                  page = context.new_page()
                  page.set_default_timeout(12000)
                  try:
                      page.goto("http://127.0.0.1:8501/")
                      poster = page.locator(".game1-guide-sheet img")
                      poster.wait_for()
                      poster.evaluate("(img) => img.decode()")
                      page.evaluate("() => document.fonts.ready")
                      start = page.get_by_role("button", name="베팅하러 가기", exact=True)
                      back = page.get_by_role("button", name="메인으로", exact=True)
                      expect(start).to_be_enabled()
                      expect(back).to_be_enabled()
                      page.wait_for_function("() => !!window.__newsBgmPlayer")
                      assert not page.locator("#news-bgm-controls").count()
                      metrics = page.evaluate("""() => {
                        const q = s => document.querySelector(s);
                        const rect = el => {
                          const {x,y,width,height,right,bottom} = el.getBoundingClientRect();
                          return {x,y,width,height,right,bottom};
                        };
                        const img = q('.game1-guide-sheet img'), copy = q('.game1-guide-copy');
                        const main = q('[data-testid="stMain"]') || document.scrollingElement;
                        const doc = document.documentElement;
                        const copyStyle = getComputedStyle(copy);
                        return {
                          viewport: [innerWidth,innerHeight],
                          widths: [doc.clientWidth,doc.scrollWidth,main.clientWidth,main.scrollWidth],
                          image: rect(img), native: [img.naturalWidth,img.naturalHeight],
                          controls: Array.from(q('.st-key-game1-guide-actions').querySelectorAll('button'), rect),
                          copy: rect(copy), clip: copyStyle.clipPath,
                          textSize: parseFloat(getComputedStyle(copy.querySelector('li')).fontSize)
                        };
                      }""")
                      print(label, json.dumps(metrics, ensure_ascii=False))
                      (out / f"{label}.json").write_text(json.dumps(metrics, indent=2))
                      page.screenshot(path=str(out / f"{label}.png"))
                      assert metrics["viewport"] == [width, height], "viewport mismatch"
                      dw, ds, mw, ms = metrics["widths"]
                      assert ds <= dw + 1 and ms <= mw + 1, "horizontal scroll"
                      assert min(metrics["native"]) > 0, "empty poster"
                      assert len(metrics["controls"]) == 2, "missing action"
                      boxes = [metrics["image"], *metrics["controls"]]
                      if width > height and height <= 540:
                          assert metrics["clip"] == "none" and metrics["textSize"] >= 14, "landscape copy is clipped or too small"
                          assert metrics["copy"]["width"] > 120, "landscape copy collapsed"
                          boxes.append(metrics["copy"])
                      for box in boxes:
                          assert min(box["width"], box["height"]) > 0, "collapsed element"
                          assert min(box["x"], box["y"]) >= -1 and box["right"] <= width+1 and box["bottom"] <= height+1, "outside viewport"
                      assert all(box["height"] >= 44 for box in metrics["controls"]), "undersized touch target"
                      start.click()
                      expect(page.get_by_role("heading", name="Bet destination")).to_be_visible()
                      page.get_by_role("button", name="Open tutorial").click()
                      back.click()
                      expect(page.get_by_role("heading", name="Main destination")).to_be_visible()
                  except Exception as exc:
                      failures.append(f"{label}: {exc}")
                      traceback.print_exc()
                      page.screenshot(path=str(out / f"{label}-failure.png"))
                  finally:
                      context.close()
              browser.close()
          assert not failures, "\n".join(failures)
          PY
      - name: Save viewport diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game1-tutorial-layout
          path: ${{ runner.temp }}/guide-evidence/
          if-no-files-found: ignore
          retention-days: 2
