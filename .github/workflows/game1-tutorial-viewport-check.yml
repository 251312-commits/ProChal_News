name: Temporary Game 1 tutorial screen check
on:
  push:
    branches:
      - feat/game1-tutorial-card
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q streamlit==1.55.0 pytest playwright
          if ! fc-list :lang=ko family | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Unit tests
        run: python -m pytest -q
      - name: Check the rendered tutorial at five viewport sizes
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
          PYTHONUNBUFFERED: '1'
        run: |
          export PYTHONPATH="$PWD"
          mkdir -p "$RUNNER_TEMP/guide-evidence"
          cat > "$RUNNER_TEMP/guide_app.py" <<'PY'
          import streamlit as st
          from games.game1_tutorial import show_game_1_tutorial
          from modules.ui_components import change_page, inject_casino_theme
          from sounds.bgm import init_seamless_bgm

          st.session_state.setdefault("page", "game_1_tutorial")
          page = st.session_state.page
          inject_casino_theme()
          init_seamless_bgm("", "", show_controls=page == "main")
          if page == "game_1_tutorial":
              show_game_1_tutorial()
          else:
              st.header({"game_1": "Bet destination", "main": "Main destination"}[page])
              if st.button("Open tutorial"):
                  change_page("game_1_tutorial")
          PY
          python -m streamlit run "$RUNNER_TEMP/guide_app.py" --server.address 127.0.0.1 --server.port 8501 --server.headless true > "$RUNNER_TEMP/guide-evidence/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8501/_stcore/health
          python - <<'PY'
          import json
          import os
          import shutil
          import traceback
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          out = Path(os.environ["RUNNER_TEMP"]) / "guide-evidence"
          sizes = [(320, 568), (390, 844), (568, 320), (844, 390), (1280, 720)]
          failures = []
          chrome = shutil.which("google-chrome") or shutil.which("google-chrome-stable")
          assert chrome, "Preinstalled Google Chrome was not found"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=chrome, headless=True)
              for width, height in sizes:
                  label = f"{width}x{height}"
                  context = browser.new_context(
                      viewport={"width": width, "height": height}, locale="ko-KR",
                      is_mobile=width < 1000, has_touch=width < 1000,
                      device_scale_factor=1,
                  )
                  page = context.new_page()
                  page.set_default_timeout(12000)
                  try:
                      page.goto("http://127.0.0.1:8501/")
                      images = page.locator(".game1-guide-sheet img")
                      steps = page.locator(".game1-guide-sheet ol li")
                      expect(steps).to_have_count(4)
                      expect(images).to_have_count(4)
                      images.evaluate_all("(images) => Promise.all(images.map(img => img.decode()))")
                      page.evaluate("() => document.fonts.ready")
                      buttons = {
                          "skip": page.locator(".st-key-game1-guide-skip").get_by_role("button", name="건너뛰기"),
                          "start": page.locator(".st-key-game1-guide-start").get_by_role("button", name="베팅하러 가기"),
                          "back": page.get_by_role("button", name="메인으로"),
                      }
                      for button in buttons.values():
                          expect(button).to_be_enabled()
                      page.wait_for_function("() => !!window.__newsBgmPlayer")
                      rect_js = '''(el) => { const {x, y, width, height, right, bottom} = el.getBoundingClientRect();
                          return {x, y, width, height, right, bottom}; }'''
                      metrics = page.evaluate('''() => {
                          const doc = document.documentElement;
                          const main = document.querySelector('[data-testid="stMain"]') || document.scrollingElement;
                          return {viewport: [innerWidth,innerHeight],
                              widths: [doc.clientWidth,doc.scrollWidth,main.clientWidth,main.scrollWidth]};
                      }''')
                      metrics["images"] = [img.evaluate(rect_js) for img in images.all()]
                      metrics["controls"] = {name: button.evaluate(rect_js) for name, button in buttons.items()}
                      metrics["steps"] = [step.evaluate(rect_js) for step in steps.all()]
                      metrics["text"] = steps.evaluate_all('''(items) => items.map(li => {
                          const walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT);
                          const copy = [];
                          while (walker.nextNode()) {
                              const n = walker.currentNode;
                              if (!n.textContent.trim() || n.parentElement.closest('svg')) continue;
                              const r = document.createRange(); r.selectNodeContents(n);
                              const box = r.getBoundingClientRect(), style = getComputedStyle(n.parentElement);
                              copy.push({s:n.textContent.trim(), size:parseFloat(style.fontSize),
                                  x:box.x, y:box.y, right:box.right, bottom:box.bottom,
                                  width:box.width,height:box.height});
                          }
                          return copy;
                      })''')
                      print(label, json.dumps(metrics, ensure_ascii=False))
                      (out / f"{label}.json").write_text(json.dumps(metrics, ensure_ascii=False, indent=2))
                      page.screenshot(path=str(out / f"{label}.png"))
                      assert metrics["viewport"] == [width, height], "viewport mismatch"
                      dw, ds, mw, ms = metrics["widths"]
                      assert ds <= dw + 1 and ms <= mw + 1, "horizontal scroll"
                      art, controls = metrics["images"], metrics["controls"]
                      bounds = [*art, *controls.values(), *metrics["steps"]]
                      for words in metrics["text"]:
                          assert words, "step is missing readable copy"
                          korean = [w for w in words if any("가" <= c <= "힣" for c in w["s"])]
                          assert korean and min(w["size"] for w in korean) >= 11.5, "step copy too small"
                          bounds.extend(korean)
                      for box in bounds:
                          assert min(box["width"], box["height"]) > 0, "collapsed element"
                          assert min(box["x"], box["y"]) >= -1 and box["right"] <= width+1 and box["bottom"] <= height+1, f"outside viewport: {box}"
                      assert all(box["height"] >= 44 for box in controls.values()), "undersized touch target"
                      assert controls["skip"]["bottom"] <= min(i["y"] for i in art)+1, "skip should precede illustrations"
                      assert controls["start"]["y"] >= max(i["bottom"] for i in art)-1, "start should follow illustrations"
                      if width == 390 and height == 844:
                          centers = [(b["x"]+b["width"]/2, b["y"]+b["height"]/2) for b in art]
                          assert centers[0][0] < centers[1][0] > centers[2][0] < centers[3][0], "expected left-right-left-right progression"
                          assert all(a[1] < b[1] for a,b in zip(centers, centers[1:])), "the four steps should descend"
                      for action, destination in [("skip", "Bet destination"), ("start", "Bet destination"), ("back", "Main destination")]:
                          buttons[action].click()
                          expect(page.get_by_role("heading", name=destination)).to_be_visible()
                          if action != "back":
                              page.get_by_role("button", name="Open tutorial").click()
                  except Exception as exc:
                      failures.append(f"{label}: {exc}")
                      traceback.print_exc()
                      page.screenshot(path=str(out / f"{label}-failure.png"))
                  finally:
                      context.close()
              browser.close()
          if (out / "390x844.png").exists():
              import base64
              from io import BytesIO
              from PIL import Image
              buf = BytesIO()
              Image.open(out / "390x844.png").convert("RGB").save(buf, format="WEBP", quality=90)
              # Emit the visual review copy in modest lines for the PR preview.
              b64 = base64.b64encode(buf.getvalue()).decode()
              for i in range(0, len(b64), 1800):
                  print("GUIDE_SCREEN=" + b64[i:i+1800])
          assert not failures, "\n".join(failures)
          PY
      - name: Save viewport diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game1-tutorial-layout
          path: ${{ runner.temp }}/guide-evidence/
          if-no-files-found: ignore
          retention-days: 2
