name: Bank animation regression
on:
  pull_request:
    paths:
      - "views/bank.py"
      - "views/bank_draw.py"
      - "views/bank_draw.css"
      - "views/bank_forms.py"
      - "tests/test_bank_animation.py"
      - ".github/workflows/bank-animation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-animation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse edited views and check the bank transaction animation
        run: |
          python -m compileall -q views/bank.py views/bank_draw.py views/bank_forms.py
          python -m unittest discover -s tests -p test_bank_animation.py -v
