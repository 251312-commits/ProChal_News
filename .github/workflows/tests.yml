name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  production-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies (without model weights)
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify real imports and logged-out app startup
        run: |
          python - <<'PY'
          import streamlit
          import onnxruntime
          import tokenizers
          import huggingface_hub
          import newspaper
          import google.genai
          import gspread
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("news.py", default_timeout=35).run()
          assert not app.exception, [str(err) for err in app.exception]
          print("Full production imports and logged-out startup: OK")
          PY
      - name: Verify ONNX model download, one score and process peak memory
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import resource
          from modules.news_ai import similarity_check
          result = similarity_check(
              "한국의 뉴스 서비스가 새 기사를 공개했다.",
              "뉴스 서비스에서 새 기사 공개",
          )
          assert 0 <= result["score"] <= 100, result
          assert 0 <= result["score_hundredths"] <= 10000, result
          assert result["token_count"] > 0, result
          assert "ONNX INT8" in result["model_name"], result
          # Linux reports ru_maxrss in KiB. Record peak; do not treat CI
          # runner memory capacity as identical to Streamlit Cloud.
          peak_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
          print(f"ONNX INT8 score: {result['score']:.2f}")
          print(f"Peak resident memory: {peak_mb:.0f} MiB")
          PY

  python-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check streamlit==1.55.0
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node for Apps Script contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check game loading JavaScript syntax
        run: |
          node --check modules/loading_feedback.js
          node --check games/shared/similarity_video_controls.js
          node --check games/shared/news_slot/slot.js
          node --check games/game4_ui/picker/picker.js
          node --check games/shared/article_reader/reader.js
          node --check games/game1/prediction_screen/prediction.js
          node --check games/game1/result_screen/result.js
      - name: Test serialized ledger and Game 1 parent audio controller
        run: node --test tests/test_transaction_gateway.cjs tests/test_game1_result_parent_audio.cjs tests/test_loading_feedback.cjs tests/test_similarity_video_audio.cjs tests/test_game4_reveal_animation.cjs
