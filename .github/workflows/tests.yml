name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check streamlit==1.55.0
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node for Apps Script contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test serialized ledger with mocked Sheets API
        run: node --test tests/test_transaction_gateway.cjs
