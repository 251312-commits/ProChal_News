name: Verify perceptual BGM volume
on:
  push:
    branches: [fix/bgm-perceptual-volume]
permissions:
  contents: read
jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check BGM gain and mute in browser
        shell: bash
        run: |
          set -eu
          python -m venv /tmp/bgm-gain-venv
          source /tmp/bgm-gain-venv/bin/activate
          pip -q install streamlit==1.55.0 playwright
          python -m unittest discover -s tests -p test_bgm_settings.py -v
          cat > bgm_gain_demo.py <<'PY'
          import streamlit as st
          from sounds.bgm import init_seamless_bgm
          st.title("BGM perceptual gain test")
          init_seamless_bgm("https://example.org/intro.mp3",
              "https://example.org/loop.mp3",show_controls=True)
          PY
          cat > bgm_gain_test.py <<'PY'
          from playwright.sync_api import sync_playwright, expect
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path="/usr/bin/google-chrome",args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto("http://localhost:8501")
              toggle=page.locator("#news-bgm-controls .news-bgm-toggle")
              expect(toggle).to_be_visible(timeout=30000)
              toggle.click()
              slider=page.locator("#news-bgm-controls .news-bgm-slider")
              for displayed,actual in [(10,.01),(30,.09),(50,.25),(80,.64),(100,1.0),(0,0)]:
                  slider.fill(str(displayed))
                  values=page.evaluate("""() => {
                      const p=window.__newsBgmPlayer;
                      return [p.volume,p.intro.volume,p.loop.volume,p.muted];
                  }""")
                  print(displayed,values,flush=True)
                  assert abs(values[0]-displayed/100)<.00001
                  assert abs(values[1]-actual)<.00001 and abs(values[2]-actual)<.00001
                  assert values[3] is (displayed==0)
              slider.fill("70")
              page.locator("#news-bgm-controls .news-bgm-mute input").check()
              assert page.evaluate("window.__newsBgmPlayer.intro.volume")==0
              assert page.evaluate("window.__newsBgmPlayer.loop.volume")==0
              page.locator("#news-bgm-controls .news-bgm-mute input").uncheck()
              assert abs(page.evaluate("window.__newsBgmPlayer.loop.volume")-.49)<.00001
              page.close()
              browser.close()
          PY
          streamlit run bgm_gain_demo.py --server.headless true --browser.gatherUsageStats false >/tmp/bgm-gain.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://localhost:8501/_stcore/health; then break; fi; sleep 1; done
          python bgm_gain_test.py || { cat /tmp/bgm-gain.log; exit 1; }
